# ~/.kn9t/config.toml — for real: OpenCode Go, MiMo v2.6 Pro.
# The key comes from the environment; it is never written down here.
default_model = "mimo-v2.6-pro"

[provider.opencode-go]
kind     = "openai"
base_url = "https://opencode.ai/zen/go/v1"
api_key  = "env:OPENCODE_API_KEY"

[provider.opencode-go.quirks]
usage_in_stream = true
# Chat has no reasoning-input form: DeepSeek 400s on a replayed `thinking` part.
thinking_replay = "strip"
# Capture the reasoning stream as thinking blocks (visible in the TUI).
thinking_style = "reasoning_content"

# The gateway routes by conversation id and 400s (MissingSessionID) without it —
# a static header covers every call site (the session_header quirk only covers
# the calls that remember to carry one).
[provider.opencode-go.headers]
x-opencode-session = "kn9t-demo"
