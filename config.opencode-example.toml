# kn9t — OpenCode Go + Zen provider config
#
# Copy relevant sections into ~/.kn9t/config.toml
# or use as-is if you only use OpenCode providers.
#
# Setup:
#   1. Get your API key at https://opencode.ai/auth
#   2. export OPENCODE_API_KEY=oc-xxxxxxxxxxxx
#   3. Copy this file to ~/.kn9t/config.toml (or merge sections)
#
# Docs: https://opencode.ai/docs/go/  https://opencode.ai/docs/zen/

# ══════════════════════════════════════════════════════════════════════════════
# OpenCode Go — $10/mo subscription, open-source models
# Limits: $12/5h · $30/week · $60/month
# ══════════════════════════════════════════════════════════════════════════════

[provider.opencode-go]
kind     = "openai"
base_url = "https://opencode.ai/zen/go/v1"
api_key  = "env:OPENCODE_API_KEY"

[provider.opencode-go.quirks]
usage_in_stream = true

# ── DeepSeek ────────────────────────────────────────────────────────────────

[[model]]
provider         = "opencode-go"
id               = "deepseek-v4-pro"
ctx              = 131072
