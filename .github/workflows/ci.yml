name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The mechanical invariant gates (GI-1, schema drift, mojibake, unwrap trend,
  # SSE race wiring) -- the same script the pre-commit hook runs, so a clone that
  # never ran `scripts/install-hooks.sh` cannot drift silently.
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-unwrap-trend.sh diffs against origin/main.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-ci.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -- --check
      # AGENTS.md 8: warnings are errors. The workspace is at zero warnings
      # across all targets -- keep this a hard gate.
      - name: Build (warnings are errors)
        run: cargo build --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      # `kn9t-react`'s acceptance tests spawn the real `kn9t-tools` subprocess, and
      # `kn9t-test-support` looks for its binary at
      # `plugins/kn9t-tools/target/{debug,release}/`. That crate is a standalone
      # workspace (ADR-0004), so `cargo build --workspace` does not produce it — without
      # this step the three spawn-dependent tests fail with "binary not found".
      - name: Build the kn9t-tools plugin (needed by kn9t-react tests)
        run: cargo build
        working-directory: plugins/kn9t-tools
      - name: Test
        run: cargo test --workspace --no-fail-fast

  # Only the reference plugins shipped in this repo are tested here — they sit
  # outside the workspace, each with its own [workspace] table (ADR-0004: a
  # third-party plugin needs nothing from this repo), so `cargo test
  # --workspace` never sees them.
  #
  # The vendor/example plugins (anthropic, mcp, policy, compactor, subagent,
  # ask-user, agents-md, …) live in their own repository,
  # https://github.com/96Ems/kn9t-plugins, and run their own CI there.
  plugins-rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [kn9t-tools, kn9t-test-plugin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
        working-directory: plugins/${{ matrix.plugin }}
