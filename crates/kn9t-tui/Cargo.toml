[package]
name    = "kn9t-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# R-TUI-010/GI-6: NO kn9t-* dependencies allowed.
[dependencies]
ratatui       = "0.29"
crossterm     = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
ureq          = { version = "2", features = ["json", "tls"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
toml          = "0.8"
pulldown-cmark = "0.10"
syntect       = { version = "5", default-features = false, features = ["default-fancy"] }  # Syntax highlighting
arboard       = { version = "3", features = ["image-data"] }  # Cross-platform clipboard with image support
png           = "0.17"   # PNG encoding for clipboard images
base64        = "0.22"   # Base64 encoding for image data URIs
regex = "1.13.1"
unicode-segmentation = "1.13"  # Word/grapheme boundaries for CJK/emoji-aware navigation

[[bin]]
name = "kn9t-tui"
path = "src/main.rs"
