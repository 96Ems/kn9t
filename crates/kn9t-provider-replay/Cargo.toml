[package]
name = "kn9t-provider-replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "kn9t replay provider: raw-byte fixtures replayed through the genuine parser for offline, zero-cost tests."

[dependencies]
kn9t-provider-core = { path = "../kn9t-provider-core" }
serde_json = { workspace = true }

[dev-dependencies]
# GI-1 scope is [dependencies] only (spec/README.md). Tests need
# `kn9t_core::Quirks`, which provider-core deliberately does not re-export
# because it collides with its own HTTP `Quirks`.
kn9t-core = { path = "../kn9t-core" }
