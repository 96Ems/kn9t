# Default model pricing - USD per 1M tokens
# Source: Pi project pricing data (Aug 2026)
# Config-defined prices always override these defaults.
# Patterns are matched in order - more specific patterns should come first.

# ══════════════════════════════════════════════════════════════════════════════
# Anthropic Claude
# ══════════════════════════════════════════════════════════════════════════════

# Claude Fable 5 (reasoning, 1M context)
[[model]]
pattern = "claude.*fable.*5"
input = 10.0
output = 50.0
cache_read = 1.0
cache_write = 12.5

# Claude Opus 5 / 4.5 / 4.8 / 4
[[model]]
pattern = "claude.*opus.*(5|4)"
input = 5.0
output = 25.0
cache_read = 0.5
cache_write = 6.25

# Claude Sonnet 5 / 4.5 / 4.6 / 4
[[model]]
pattern = "claude.*sonnet.*(5|4)"
input = 3.0
output = 15.0
cache_read = 0.3
cache_write = 3.75

# Claude Haiku 4.5 / 4
[[model]]
pattern = "claude.*haiku.*(4|5)"
input = 1.0
output = 5.0
cache_read = 0.1
cache_write = 1.25

# Claude 3.5 Sonnet
[[model]]
pattern = "claude.*3.*5.*sonnet|claude.*sonnet.*3.*5"
input = 3.0
output = 15.0
cache_read = 0.3
cache_write = 3.75

# Claude 3 Haiku
[[model]]
pattern = "claude.*3.*haiku|claude.*haiku.*3"
input = 0.25
output = 1.25
cache_read = 0.03
cache_write = 0.30

# Claude 3 Opus
[[model]]
pattern = "claude.*3.*opus|claude.*opus.*3"
input = 15.0
output = 75.0
cache_read = 1.5
cache_write = 18.75

