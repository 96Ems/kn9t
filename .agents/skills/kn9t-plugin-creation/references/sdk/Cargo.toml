[package]
name = "kn9t-plugin-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.98"
description = "SDK for writing kn9t plugins in Rust. Zero workspace deps — suitable for crates.io publication."

# No kn9t-* workspace dependencies (R-PLUG2-010).
[dependencies]
kn9t-macros = { path = "kn9t-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
