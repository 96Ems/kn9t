[workspace]
resolver = "2"
members = [
    "crates/kn9t-core",
    "crates/kn9t-provider-replay",
    "crates/kn9t-react",
    "crates/kn9t-store",
    "crates/kn9t-provider-core",
    "crates/kn9t-provider-openai",
    "crates/kn9t-server",
    "crates/kn9t-tui",
    "crates/kn9t-plugin",
    "crates/kn9t-plugin-sdk",
    "crates/kn9t",
    "xtask"
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows bracketed paste: crossterm 0.29.0 does not support Event::Paste on
# Windows with modern terminals (Windows Terminal, Alacritty, WezTerm). The fix
# is 38 commits in eitsupi's fork, PR #1030, not yet merged upstream.
#
# Without this patch: pasting multi-line text in the TUI inserts it character
# by character as KeyEvent::Char, losing newlines or triggering premature submit.
# With the patch: paste arrives as a single Event::Paste(String).
#
# The lock pins commit 94ed7154 so branch moves do not affect reproducibility.
# Remove this patch once crossterm publishes a version containing PR #1030.
# Track: https://github.com/crossterm-rs/crossterm/pull/1030
[patch.crates-io]
crossterm = { git = "https://github.com/eitsupi/crossterm", rev = "94ed7154e35d24a2f643c61760e1eb05b8ca9e63" }
