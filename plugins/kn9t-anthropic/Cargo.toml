[package]
name        = "kn9t-anthropic-plugin"
version     = "0.1.0"
edition     = "2021"
description = "Anthropic Messages API provider as a kn9t plugin"

[[bin]]
name = "kn9t-anthropic"
path = "src/main.rs"

[dependencies]
kn9t-plugin-sdk = { path = "../../kn9t-plugin-sdk" }
serde_json       = "1"
ureq             = { version = "2", features = ["tls"] }
